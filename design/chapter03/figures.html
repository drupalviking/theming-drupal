<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chapter 3 figures</title>
<!-- Only for Figure 3.5's two turned-down pairs: the club's own fonts are self-hosted below. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&amp;family=Source+Sans+3:wght@300..800&amp;family=Source+Serif+4:opsz,wght@8..60,400..800&amp;display=swap">
<!--
  The figures of Chapter 3, Designing Lens & Trail. Each <figure id="..."> is
  screenshotted by tools/design_figures.py into manuscript/images/<id>.png.
  The colors and sizes are the club's design decisions from the chapter; the
  fonts are the self-hosted files in design/fonts/.
-->
<style>
@font-face { font-family: "Bricolage Grotesque"; src: url("../fonts/bricolage-grotesque/BricolageGrotesque[opsz,wdth,wght].ttf") format("truetype"); font-weight: 200 800; font-stretch: 75% 100%; }
@font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../fonts/atkinson-hyperlegible-next/AtkinsonHyperlegibleNext[wght].ttf") format("truetype"); font-weight: 200 800; }
@font-face { font-family: "Atkinson Hyperlegible Next"; font-style: italic; src: url("../fonts/atkinson-hyperlegible-next/AtkinsonHyperlegibleNext-Italic[wght].ttf") format("truetype"); font-weight: 200 800; }

:root {
  --green-50:#e4fbf3; --green-100:#d3efe6; --green-200:#baddd2; --green-300:#9ac6b8; --green-400:#75ab9b; --green-500:#4c8f7c; --green-600:#2f7865; --green-700:#1f6f5c; --green-800:#184d40; --green-900:#0c362c; --green-950:#032019;
  --sand-50:#fff3e8; --sand-100:#ffe2c8; --sand-200:#f0cdac; --sand-300:#dcb189; --sand-400:#c69360; --sand-500:#ad712f; --sand-600:#955907; --sand-700:#895103; --sand-800:#603703; --sand-900:#442602; --sand-950:#2a1500;
  --neutral-0:#ffffff; --neutral-50:#fbf6f0; --neutral-100:#f0eae4; --neutral-200:#dcd6d1; --neutral-300:#c2bdb7; --neutral-400:#a39d98; --neutral-500:#847f7b; --neutral-600:#6c6863; --neutral-700:#5b5753; --neutral-800:#46423d; --neutral-900:#2c2824; --neutral-950:#16130f;
  --heather-100:#f9def6; --heather-500:#a2699d; --heather-700:#82477d; --heather-800:#5a3156;
  --font-heading: "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", system-ui, sans-serif;
}
/* The roles, light and dark. */
.light { --bg:var(--neutral-50); --surface:var(--neutral-0); --text:var(--neutral-900); --muted:var(--neutral-700); --border:var(--neutral-200); --action:var(--green-700); --on-action:#fff; --accent:var(--sand-500); --accent-text:var(--sand-700); --tint:var(--sand-100); --on-tint:var(--sand-800); }
.dark { --bg:#161310; --surface:#221f1b; --text:var(--neutral-100); --muted:var(--neutral-400); --border:var(--neutral-800); --action:var(--green-400); --on-action:var(--neutral-950); --accent:var(--sand-400); --accent-text:var(--sand-300); --tint:var(--sand-900); --on-tint:var(--sand-200); }

* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #e9e6e2; font-family: var(--font-body); color: #2c2824; }
figure { margin: 0 0 48px; padding: 24px; background: #fff; width: max-content; max-width: 1200px; }
.row { display: flex; gap: 24px; align-items: flex-start; }
.label { font: 600 13px/1.3 var(--font-body); color: #5b5753; letter-spacing: .04em; text-transform: uppercase; }
.panel { background: var(--bg); color: var(--text); padding: 20px; border-radius: 8px; display: grid; gap: 14px; }

/* Hike card */
.card { width: 320px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.card .photo { aspect-ratio: 3/2; background: linear-gradient(172deg, #a8bccb 0%, #cdd6d6 36%, #8a9a72 37%, #5d704f 60%, #3e4a36 100%); }
.card .body { padding: 14px 16px 18px; display: grid; gap: 8px; }
.card time { font-weight: 700; font-size: 15px; color: var(--muted); }
.card h3 { margin: 0; font: 650 24px/1.15 var(--font-heading); font-variation-settings: "opsz" 24; }
.card .facts { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { padding: 2px 10px; border-radius: 999px; background: var(--tint); color: var(--on-tint); font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.card p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
.card .area { font-size: 14px; color: var(--muted); font-weight: 700; }
.next { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent-text); font-size: 15px; }
.next i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.btn { background: var(--action); color: var(--on-action); padding: 10px 18px; border-radius: 4px; font-weight: 700; font-size: 16px; display: inline-block; }
.link { color: var(--action); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
nav.menu { display: flex; gap: 18px; align-items: baseline; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-size: 16px; }
nav.menu b { font: 700 20px var(--font-heading); margin-right: auto; }
nav.menu .current { color: var(--action); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }

/* Contrast samples */
.sample { width: 340px; padding: 22px; border-radius: 8px; display: grid; gap: 8px; }
.sample .t { font: 650 26px/1.2 var(--font-heading); }
.sample .b { font-size: 17px; }
.verdict { font: 700 15px var(--font-body); }

/* Scales */
.scale { display: grid; grid-template-columns: 110px repeat(11, 82px); gap: 4px; align-items: stretch; margin-bottom: 10px; }
.scale .name { font: 700 16px var(--font-body); align-self: center; }
.chip { height: 74px; border-radius: 4px; padding: 6px; font: 600 12px/1.25 var(--font-body); display: flex; flex-direction: column; justify-content: flex-end; }
.chip.base { outline: 3px solid #2c2824; outline-offset: 2px; }

/* Type */
.pair { width: 360px; display: grid; gap: 10px; padding: 18px; border: 1px solid #dcd6d1; border-radius: 8px; }
.pair .h { font-size: 34px; line-height: 1.08; }
.pair .h2 { font-size: 21px; line-height: 1.2; }
.pair .t { font-size: 16px; line-height: 1.55; margin: 0; }
.pair.chosen { outline: 3px solid var(--green-700); outline-offset: 3px; }
.steps { display: grid; grid-template-columns: 90px 440px 640px; gap: 6px 24px; align-items: baseline; }
.steps .k { font: 600 14px ui-monospace, Menlo, monospace; color: #5b5753; }
.steps .v { font-family: var(--font-heading); line-height: 1.1; white-space: nowrap; }
.steps .v small { font: 600 12px var(--font-body); color: #5b5753; margin-left: 8px; }

/* Wireframes: greys only */
.wire { --w:#2c2824; --g1:#f0eae4; --g2:#dcd6d1; --g3:#a39d98; background:#fff; border: 2px solid var(--w); border-radius: 18px; padding: 12px; font-family: var(--font-body); color: var(--w); }
.wire .box { background: var(--g2); border-radius: 4px; display: grid; place-items: center; font-size: 13px; color: #46423d; }
.wire .line { height: 10px; background: var(--g2); border-radius: 3px; }
.facts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fact { background: var(--g1); border-radius: 4px; padding: 8px; }
.fact b { display: block; font-size: 12px; color: #5b5753; font-weight: 600; }
.fact span { font-size: 15px; font-weight: 700; }
.callout { width: 26px; height: 26px; border-radius: 50%; background: var(--sand-500); color: #fff; font: 700 14px var(--font-body); display: inline-grid; place-items: center; flex: none; }

/* Slider */
.hero { position: relative; width: 900px; height: 380px; border-radius: 8px; overflow: hidden; background: linear-gradient(175deg, #7f99ad 0%, #b9c6c9 40%, #6f8460 41%, #3d4a35 100%); color: #fff; }
.hero .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(22 19 15 / .78) 0%, rgb(22 19 15 / .45) 45%, rgb(22 19 15 / 0) 75%); }
.hero .text { position: absolute; left: 40px; bottom: 70px; display: grid; gap: 12px; max-width: 460px; }
.hero h2 { margin: 0; font: 750 46px/1.02 var(--font-heading); font-variation-settings: "opsz" 96; }
.hero .controls { position: absolute; left: 40px; right: 40px; bottom: 22px; display: flex; gap: 10px; align-items: center; }
.ctrl { width: 40px; height: 40px; border-radius: 50%; background: rgb(22 19 15 / .7); border: 2px solid #fff; display: grid; place-items: center; }
.ctrl svg { width: 18px; height: 18px; }
.dots { display: flex; gap: 8px; margin-left: 8px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
.dots i.on { background: #fff; }

/* Print */
.paper { width: 595px; height: 842px; background: #fff; border: 1px solid #c2bdb7; box-shadow: 0 4px 18px rgb(0 0 0 / .15); padding: 56px 60px; font-family: var(--font-body); color: #000; display: grid; align-content: start; gap: 16px; }
.paper header { display: flex; align-items: center; gap: 10px; font: 700 15px var(--font-heading); border-bottom: 1px solid #000; padding-bottom: 10px; }
.paper h1 { margin: 0; font: 700 32px/1.1 var(--font-heading); }
.paper dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
.paper dt { font-weight: 700; }
.paper dd { margin: 0; }
.paper p { margin: 0; font-size: 14px; line-height: 1.55; }
.paper .url { font-size: 12px; color: #000; }
</style>
</head>

<script>
const scales = { green: 'green', sand: 'sand', neutral: 'neutral' };
const css = getComputedStyle(document.documentElement);
for (const [id, name] of Object.entries(scales)) {
  const row = document.getElementById('scale-' + id);
  for (const step of [50,100,200,300,400,500,600,700,800,900,950]) {
    const hex = css.getPropertyValue(`--${name}-${step}`).trim();
    const c = document.createElement('div');
    c.className = 'chip' + (name === 'green' && step === 700 ? ' base' : '');
    c.style.background = hex;
    c.style.color = step >= 500 ? '#fff' : '#16130f';
    c.innerHTML = `${step}<br>${hex}`;
    row.appendChild(c);
  }
}
const steps = document.getElementById('steps');
const names = [[5,'Lens & Trail'],[4,'Hikes this autumn'],[3,'Turnhouse Hill'],[2,'Meeting place'],[1,'Next hike'],[0,'We walk every other Saturday.'],[-1,'Photo: CC BY-SA 4.0']];
for (const [s, text] of names) {
  const a = 17 * 1.2 ** s, b = 18 * 1.25 ** s;
  steps.insertAdjacentHTML('beforeend', `<span class="k">step ${s}</span><span class="v" style="font-size:${a}px">${text}<small>${a.toFixed(1)}px</small></span><span class="v" style="font-size:${b}px">${text}<small>${b.toFixed(1)}px</small></span>`);
}
</script>
