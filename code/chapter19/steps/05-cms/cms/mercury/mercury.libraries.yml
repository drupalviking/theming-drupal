global:
  version: VERSION
  css:
    theme:
      src/fonts.css:
        preprocess: false
      build/main.min.css:
        # Avoid attempting to re-minify main.min.css. Also ensure it's served in
        # its own right so that browsers only download it once, instead of via
        # aggregates where it may get duplicated across files.
        preprocess: false
        minified: true
      src/theme.css:
        preprocess: false

messages:
  version: VERSION
  js:
    lib/messages.js: {}
  dependencies:
    - core/drupal
    - core/once

motion:
  js:
    build/motion.js: { minified: true }
  dependencies:
    - core/once

# The visitor's color scheme, before the page is painted: the core theme's
# script, unchanged.
color-scheme-early:
  version: VERSION
  header: true
  js:
    js/color-scheme-early.js: {}

# The main menu's dropdown and the Hikes panel: the core theme's script,
# unchanged, and its CSS with Mercury's variable names. Attached by
# menu--extras--main.html.twig.
main-menu:
  version: VERSION
  css:
    component:
      css/main-menu.css: {}
  js:
    js/main-menu.js: {}
  dependencies:
    - core/drupal
    - core/once

# Chapter 18's content templates: plain CSS, like the main menu's, with the
