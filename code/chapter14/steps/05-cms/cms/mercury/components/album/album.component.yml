$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Album
description: A grid of photos, with a lightbox. The core theme's component, with Tailwind and Mercury's way of writing component scripts.
group: Lens & Trail
status: stable
props:
  type: object
  properties: {}
slots:
  photos:
    title: Photos
    description: One li element for each photo, each with a link to the large photo (class album__link, with data-srcset and data-caption).
# Mercury's component scripts are JavaScript modules: they import the shared
# code in lib/ instead of being bundled.
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
  js:
    album.js: { attributes: { type: module } }
