# Numbers in the book that go out of date: versions, and support dates.
#
# The manuscript doesn't contain these numbers directly. It contains a
# placeholder, {{ number:drupal_version }}, and tools/build.py fills it in from
# this file. (The "number:" part keeps the placeholders apart from Twig, which
# uses {{ }} too: a theming book has a lot of Twig.) {{ number:checked }} is the
# date the numbers were last fetched, as "7 November 2026".
#
# To update: python3 tools/update_numbers.py, then python3 tools/build.py.
#
# Each entry has:
#   value:  what goes into the book. Always quoted, so YAML doesn't turn 11.10
#           into the number 11.1.
#   label:  what the number is, and where the book uses it.
#   source: where a person can check it in a browser.
#   fetch:  how tools/update_numbers.py finds the current value. Entries
#           without it need a person: the script lists them to check by hand.
#
# Fetch methods (the details are in tools/update_numbers.py, copied from the
# site-building book):
#   json:   a URL returning JSON, and path: to the value. A path is keys and list
#           indexes separated by dots; * takes every item of a list, and
#           [key=value] picks the first item where key has that value.
#   text:   a URL returning HTML or text, and regex: with one group.
#   npm, pypi, github_release, github_tags, nuget: a package or repository name.
# Options: pick: first|max, stable: true (skip beta, rc...), add: N,
# format: thousands.

checked: '2026-11-07'

numbers:

  drupal_version:
    value: '11.4.11'
    label: Drupal core, newest stable version
    source: https://www.drupal.org/project/drupal
    fetch:
      json: https://endoflife.date/api/drupal.json
      path: 0.latest

  drupal_cms_version:
    value: '2.2.8'
    label: Drupal CMS, newest version (the CMS test site)
    source: https://new.drupal.org/drupal-cms
    fetch:
      json: https://repo.packagist.org/p2/drupal/cms.json
      path: packages.drupal/cms.*.version
      stable: true

  drupal12_released:
    value: 'December 2026 (planned)'
    label: Drupal 12, release date; write the date once it's out
    source: https://www.drupal.org/about/core/policies/core-release-cycles/schedule

  mercury_version:
    value: '1.0.5'
    label: Mercury, Drupal CMS's front-end theme and the CMS site's starterkit; 1.0.5 requires Drupal ^11.3, no Drupal 12 release yet (2026-11-07)
    source: https://www.drupal.org/project/mercury
    fetch:
      json: https://packages.drupal.org/files/packages/8/p2/drupal/mercury.json
      path: packages.drupal/mercury.*.version
      stable: true

  canvas_version:
    value: '1.12.0'
    label: Drupal Canvas, newest version; requires Drupal ^11.3 (2026-11-07)
    source: https://www.drupal.org/project/canvas
    fetch:
      json: https://packages.drupal.org/files/packages/8/p2/drupal/canvas.json
      path: packages.drupal/canvas.*.version
      stable: true

  tailwind_version:
    value: '4.3.5'
    label: Tailwind CSS, newest version (the Mercury track)
    source: https://www.npmjs.com/package/tailwindcss
    fetch:
      npm: tailwindcss

  storybook_version:
    value: '10.6.6'
    label: Storybook, newest version (the Mercury track)
    source: https://www.npmjs.com/package/storybook
    fetch:
      npm: storybook

  node_lts:
    value: '26'
    label: Node.js, newest LTS line (LTS since 2026-10-28, supported to 2029-04-30, per endoflife.date); what the Mercury track pins in DDEV's nodejs_version
    source: https://endoflife.date/nodejs
